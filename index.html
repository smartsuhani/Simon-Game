<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Squared Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="assets/product-screenshot.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="animation-area">
    
    <main id="content">
        <h1>Simon Squared Memory Game</h1>
        <h5 id="level-title" aria-live="polite">Press Start or Any Key</h5>
        <h5 id="turn-indicator" aria-live="polite"></h5>
        <button type="button" id="start-btn">Start</button>
        <div class="container">
            <div class="row">
                
                <button type="button" id="green" class="btn green" aria-label="Green pad"></button>
                <button type="button" id="red" class="btn red" aria-label="Red pad"></button>
            </div>

            <div class="row">
                <button type="button" id="yellow" class="btn yellow" aria-label="Yellow pad"></button>
                <button type="button" id="blue" class="btn blue" aria-label="Blue pad"></button>
            </div>
        </div>
    </main>

    <div aria-hidden="true">
        <ul class="box-area">
            <li> </li>
            <li> </li>
            <li> </li>
            <li> </li>
            <li> </li>
            <li> </li>
        </ul>
    </div>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="index.js" charset="utf-8"></script>
</body>

</html>
